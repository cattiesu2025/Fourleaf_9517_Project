[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "comp9517-group-project"
version = "0.1.0"
description = "COMP9517 26T2 iNaturalist species classification group project"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
